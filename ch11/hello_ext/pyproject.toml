[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "hello_ext"
version = "0.1.0"
description = "PyO3 basics: call overhead, conversion cost, exceptions, GIL release (ch11)"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "maturin>=1.9",
    "pytest>=9.2.0",
    "numpy>=2.3",
]

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.uv]
# 확장 모듈은 maturin develop 으로 따로 빌드한다(uv sync 가 프로젝트 자체를 설치하지 않게)
package = false
